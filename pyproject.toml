[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-benchmark-manager"
version = "0.3.2"
description = "Provider-agnostic LLM discovery, stability testing and AIPerf benchmarking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["llm", "benchmark", "aiperf", "mcp", "openai-compatible"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "aiperf==0.12.0",
  "numpy>=1.26.4,<2.4",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "fastapi>=0.141,<1",
  "uvicorn>=0.35,<1",
  "fastmcp>=4,<5",
  "PyYAML>=6,<7",
  "keyring>=25,<26",
  "cryptography>=45,<51",
  "platformdirs>=4,<5",
]

[project.urls]
Homepage = "https://github.com/telferi/llm-benchmark-manager"
Repository = "https://github.com/telferi/llm-benchmark-manager"
Issues = "https://github.com/telferi/llm-benchmark-manager/issues"
Changelog = "https://github.com/telferi/llm-benchmark-manager/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2"]

[project.scripts]
llmbench = "llmbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
